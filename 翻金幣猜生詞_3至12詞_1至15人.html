<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻金幣・猜生詞</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#243047;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#23375d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0}h2{margin:0 0 12px;font-size:19px}main{max-width:1100px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px #18274413}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#355b9c;color:white}button:disabled{opacity:.4;cursor:default}.secondary{background:#e7ebf3;color:#253a60}.danger{background:#a94040}.gold{background:linear-gradient(140deg,#fff3b2,#e7ac35);color:#6a4406;border:3px solid #b98018;border-radius:50%;aspect-ratio:1;width:100%;font-size:clamp(14px,2vw,24px);font-weight:800;box-shadow:inset 0 2px 6px #fff8,0 4px 7px #0002;padding:0}.gold.used{background:#d9dee9;border-color:#b7c0ce;color:#64748b;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:700px;margin:auto}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wordrow{display:grid;grid-template-columns:42px minmax(90px,1fr) minmax(140px,1.4fr) 85px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.wordrow input[type=text]{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.thumb{width:80px;height:55px;object-fit:contain;background:#f1f4f8;border-radius:7px}.small{font-size:13px;color:#66758d}.hidden{display:none!important}.card{border-radius:16px;background:#f7f9fe;padding:20px;text-align:center}.picture{width:min(100%,430px);height:290px;object-fit:contain;background:white;border-radius:12px}.placeholder{height:290px;display:grid;place-items:center;font-size:72px}.answer{font-size:36px;font-weight:800}.money{font-size:38px;font-weight:900;color:#aa7514}.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.score div{background:#edf2fa;border-radius:9px;padding:10px}.score strong{float:right}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:72px;padding:8px}input[type=file]{max-width:240px}#status{font-weight:600;color:#47608b}@media(max-width:700px){.row{grid-template-columns:1fr}.grid{gap:7px}.wordrow{grid-template-columns:24px 1fr 1fr;gap:5px}.wordrow input[type=file]{grid-column:2/4;width:100%}.picture,.placeholder{height:210px}header{padding:14px}main{padding:10px}}
</style></head><body><header><h1>🪙 翻金幣・猜生詞</h1><div class="flex"><button class="secondary" id="settingsBtn">老師設定</button><button class="secondary" id="gameBtn">遊戲畫面</button></div></header><main><section class="panel" id="settings"><h2>老師設定（課前準備）</h2><p class="small">輸入3～12個簡體字生詞，各選一張圖片。開始時系統會自動將圖片重複分配到25枚金幣，並隨機安排獎金。設定可匯出為題庫檔，下一次再匯入。</p><div class="flex"><label>生詞數 <select id="count"><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12" selected>12</option></select></label><label>學生人數 <select id="studentCount"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option></select></label><button id="exportBtn" class="secondary">匯出題庫</button><label><button type="button" class="secondary" id="importBtn">匯入題庫</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></label></div><div id="wordRows"></div><h2 style="margin-top:18px">學生姓名</h2><div id="nameRows" class="flex"></div><p class="small">獎金選項：$1、$3、$5、$10（隨機分配）。答對才加分；答錯可讓其他同學搶答。</p><button id="startBtn">開始新遊戲（重新洗牌）</button><span id="status"></span></section><section class="panel hidden" id="game"><div class="top"><h2>選一枚金幣！ <span id="progress" class="small"></span></h2><button class="secondary" id="backBtn">返回設定</button></div><div class="grid" id="coinGrid"></div><div id="question" class="card hidden" style="margin-top:20px"><h2 id="coinTitle"></h2><img id="questionImg" class="picture hidden" alt="生詞圖片"><div id="noImg" class="placeholder hidden">❔</div><p id="questionText">這是什麼？</p><div id="revealArea" class="hidden"><div id="answer" class="answer"></div><div id="prize" class="money"></div></div><div class="flex" style="justify-content:center"><button id="revealBtn">揭曉答案與獎金</button><label id="winnerWrap" class="hidden">答對學生 <select id="winner"></select></label><button id="correctBtn" class="hidden">答對，加分</button><button id="wrongBtn" class="secondary hidden">沒人答對，跳過</button></div></div></section><section class="panel" id="scoresPanel"><div class="top"><h2>🏆 學生排行榜</h2><button id="resetScores" class="secondary">分數歸零</button></div><div id="scoreboard" class="score"></div></section></main><script>
const $=id=>document.getElementById(id);const defaultWords=['书','笔','手机','杯子','猫','狗','苹果','车','家','水','书包','椅子'];let words=defaultWords.map(t=>({text:t,img:''})),names=Array.from({length:10},(_,i)=>`學生${i+1}`),scores={},deck=[],used=new Set(),active=null,showing=false;
function renderWords(){const count=+$('count').value;while(words.length<count)words.push({text:'',img:''});$('wordRows').innerHTML='';for(let i=0;i<count;i++){let w=words[i],r=document.createElement('div');r.className='wordrow';r.innerHTML=`<b>${i+1}</b><input type="text" aria-label="生詞${i+1}" placeholder="簡體字生詞"><img class="thumb" alt="圖片預覽"><input type="file" accept="image/*" aria-label="上傳圖片${i+1}">`;let [inp,img,file]=[r.children[1],r.children[2],r.children[3]];inp.value=w.text;inp.oninput=()=>w.text=inp.value;img.src=w.img||'';img.style.visibility=w.img?'visible':'hidden';file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>3*1024*1024){alert('單張圖片請小於3MB');return}let reader=new FileReader();reader.onload=()=>{w.img=reader.result;img.src=w.img;img.style.visibility='visible'};reader.readAsDataURL(f)};$('wordRows').append(r)}}
function renderNames(){let n=+$('studentCount').value;while(names.length<n)names.push(`學生${names.length+1}`);$('nameRows').innerHTML='';for(let i=0;i<n;i++){let inp=document.createElement('input');inp.type='text';inp.value=names[i];inp.style.cssText='width:130px;padding:8px;border:1px solid #cbd5e1;border-radius:8px';inp.setAttribute('aria-label',`學生${i+1}姓名`);inp.oninput=()=>{names[i]=inp.value;renderScores()};$('nameRows').append(inp)}renderScores()}
function renderScores(){let n=+$('studentCount').value;$('scoreboard').innerHTML='';Array.from({length:n},(_,i)=>i).sort((a,b)=>(scores[b]||0)-(scores[a]||0)).forEach(i=>{let el=document.createElement('div');let name=document.createElement('span');name.textContent=names[i]||`學生${i+1}`;let amt=document.createElement('strong');amt.textContent='$'+(scores[i]||0);el.append(name,amt);$('scoreboard').append(el)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function switchTo(s){$('settings').classList.toggle('hidden',s!=='settings');$('game').classList.toggle('hidden',s!=='game')}
function start(){const n=+$('count').value;if(words.slice(0,n).some(w=>!w.text.trim()||!w.img)){if(!confirm('有生詞沒有填寫或沒有圖片。仍要開始嗎？（缺圖片的題目將顯示問號）'))return}let ids=shuffle(Array.from({length:25},(_,i)=>i%n)),prizes=shuffle(Array.from({length:25},(_,i)=>[1,3,5,10][i%4]));deck=ids.map((idx,i)=>({idx,prize:prizes[i]}));used=new Set();active=null;scores={};renderScores();renderCoins();closeQuestion();switchTo('game')}
function renderCoins(){$('coinGrid').innerHTML='';deck.forEach((c,i)=>{let b=document.createElement('button');b.className='gold'+(used.has(i)?' used':'');b.textContent=used.has(i)?'✓':i+1;b.disabled=used.has(i);b.onclick=()=>openCoin(i);$('coinGrid').append(b)});$('progress').textContent=`已翻 ${used.size}/25`}
function openCoin(i){active=i;showing=false;let w=words[deck[i].idx];$('coinTitle').textContent=`第 ${i+1} 號金幣`;$('questionImg').classList.toggle('hidden',!w.img);$('noImg').classList.toggle('hidden',!!w.img);if(w.img)$('questionImg').src=w.img;$('questionText').textContent='這是什麼？';$('revealArea').classList.add('hidden');$('revealBtn').classList.remove('hidden');['winnerWrap','correctBtn','wrongBtn'].forEach(id=>$(id).classList.add('hidden'));$('question').classList.remove('hidden');$('question').scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeQuestion(){$('question').classList.add('hidden');active=null}
$('revealBtn').onclick=()=>{if(active===null)return;let c=deck[active];$('answer').textContent=words[c.idx].text||'（未設定生詞）';$('prize').textContent=`$${c.prize}`;$('revealArea').classList.remove('hidden');$('revealBtn').classList.add('hidden');['winnerWrap','correctBtn','wrongBtn'].forEach(id=>$(id).classList.remove('hidden'));$('winner').innerHTML='';for(let i=0;i<+$('studentCount').value;i++){let o=document.createElement('option');o.value=i;o.textContent=names[i]||`學生${i+1}`;$('winner').append(o)}};
function finish(correct){if(active===null)return;if(correct){let i=+$('winner').value;scores[i]=(scores[i]||0)+deck[active].prize;renderScores()}used.add(active);closeQuestion();renderCoins()}
$('correctBtn').onclick=()=>finish(true);$('wrongBtn').onclick=()=>finish(false);$('count').onchange=renderWords;$('studentCount').onchange=renderNames;$('startBtn').onclick=start;$('settingsBtn').onclick=()=>switchTo('settings');$('gameBtn').onclick=()=>{if(deck.length)switchTo('game');else alert('請先開始新遊戲')};$('backBtn').onclick=()=>switchTo('settings');$('resetScores').onclick=()=>{if(confirm('確定要將所有學生分數歸零？')){scores={};renderScores()}};
$('exportBtn').onclick=()=>{let data=JSON.stringify({count:+$('count').value,studentCount:+$('studentCount').value,words:words.slice(0,+$('count').value),names:names.slice(0,+$('studentCount').value)});let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='中文生詞題庫.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.words)||d.words.length<1||d.words.length>25)throw Error('題庫格式不正確');words=d.words.map(w=>({text:String(w.text||''),img:typeof w.img==='string'&&w.img.startsWith('data:image/')?w.img:''}));$('count').value=(+d.count>=3&&+d.count<=12)?d.count:12;names=Array.isArray(d.names)?d.names.map(x=>String(x)):names;$('studentCount').value=(+d.studentCount>=1&&+d.studentCount<=15)?d.studentCount:10;renderWords();renderNames();$('status').textContent='題庫已匯入'}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};
renderWords();renderNames();
</script></body></html>
